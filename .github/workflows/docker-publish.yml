# 把镜像发布到 GitHub 自带的容器仓库（GHCR，ghcr.io）
#
# 触发时机：
#   - 推到 main            → ghcr.io/evi1j/mimo-rl-lens:latest  + :main  + :sha-xxxxx
#   - 打 tag v1.7.9        → ghcr.io/evi1j/mimo-rl-lens:1.7.9   + :1.7
#   - Actions 页面手动点 Run workflow
#
# 不需要任何密钥：GitHub 每次运行都会发一个临时 GITHUB_TOKEN，
# 只要这里声明了 packages: write 就能往 ghcr.io 推。
# 镜像的可见性跟仓库走 —— 仓库是私有的，镜像就是私有的（要公开得去
# 包设置里手动改，或把仓库改成 public）。
name: 发布镜像

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # github.repository = 用户名/仓库名，正好就是 GHCR 的包名（必须小写）
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read # 拉代码
      packages: write # 往 ghcr.io 推镜像，就靠这一行
    steps:
      - name: 拉代码
        uses: actions/checkout@v4

      # QEMU + Buildx：为了同时出 amd64 和 arm64 两个平台的镜像。
      # 只要一种平台的话，把这两步删掉、platforms 改成一个即可（会快很多）。
      - name: 准备 QEMU
        uses: docker/setup-qemu-action@v3
      - name: 准备 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 算出镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # 注意：tags 是块标量，里面不能写 # 注释（会被当成标签内容）
          # main → latest + main；v1.7.9 → 1.7.9 + 1.7；每次构建另留一个短 sha
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          # 上下文是仓库根（镜像要 src/ 和 public/），Dockerfile 在 docker/ 下
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 用 GitHub 的构建缓存，第二次开始只重做变化的层
          cache-from: type=gha
          cache-to: type=gha,mode=max
