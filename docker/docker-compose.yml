# MiMo-V2.6 RL 训练实时看板 —— Docker 部署
#
# 用法（在本目录或仓库根目录执行都行）：
#     docker compose -f docker/docker-compose.yml up -d --build
#     docker compose -f docker/docker-compose.yml logs -f
#     docker compose -f docker/docker-compose.yml down
# 然后打开 http://<宿主机IP>:8787
#
# 构建上下文为什么是仓库根（context: ..）：镜像要的是 src/ 与 public/，
# Dockerfile 放在 docker/ 只是为了不污染根目录，所以得显式指 dockerfile。

services:
  board:
    build:
      context: ..                    # 相对本文件 → 仓库根
      dockerfile: docker/Dockerfile
    image: mimo-train-live:latest
    container_name: mimo-train-live
    restart: unless-stopped

    # 宿主:容器。只想本机访问就写成 "127.0.0.1:8787:8787"。
    ports:
      - "8787:8787"

    environment:
      TZ: Asia/Shanghai
      # 端口与监听地址。注意这两项会盖过 config.json 里的 server 段
      # （环境变量优先级更高）—— 容器里要换端口，改这里的 PORT 和上面的 ports。
      PORT: "8787"
      HOST: "0.0.0.0"

      # ── AI（可选）──────────────────────────────────────────────
      # 全都不填也能跑：解说走内置规则引擎，看板、图表讲解、数据存档都正常。
      #
      # 留空 = 不覆盖，交给挂进来的 config.json（见 volumes 那条）。
      # 填了任何一项就以它为准：环境变量 > config.json。
      # 坑：填 LLM_ENABLED=0 会把 config.json 里的 enabled:true 也一起关掉，
      # 想让配置文件作主就让它空着。
      LLM_ENABLED: ""
      LLM_BASE_URL: ""               # 例：http://host.docker.internal:8090/v1
      LLM_MODEL: ""                  # 例：qwen2.5-32b
      LLM_API_KEY: ""

    volumes:
      # SQLite 库（历史指标、解说流、教练对话）。删掉这个卷 = 清掉全部历史，
      # 下次启动会重建，跟本地删 data/ 一样。
      - board-data:/app/data

      # 想用自己那份 config.json（端口 / AI 都写在里面），去掉下面这行的注释。
      # 前提：宿主上这个文件必须真的存在 —— 不存在的话 Docker 会把它建成目录，
      # 挂进去应用读不到。先 cp config.example.json config.json 再来挂。
      # 挂的是只读的；改完文件下一次 AI 调用即生效，不用重启容器。
      # 例外：server.port / server.host 只在进程启动时读一次，而且被上面的
      #       PORT / HOST 环境变量盖着 —— 那两个只能在启动时定，改了要重启。
      # - ../config.json:/app/config.json:ro

    # Linux 上要让容器访问宿主机的推理服务（host.docker.internal），再加：
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"

    healthcheck:
      # 镜像里没有 curl / wget，用 node 自己探首页
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:' + (process.env.PORT || 8787) + '/', function (r) { process.exit(r.statusCode === 200 ? 0 : 1); }).on('error', function () { process.exit(1); })"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  board-data:
